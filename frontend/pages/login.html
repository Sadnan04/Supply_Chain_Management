<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - Inventory Guy</title>
  <link rel="stylesheet" href="../assets/css/styles.css" />
</head>
<body class="auth">
  <div class="auth-wrap">
    <div class="card auth-card">
      <div class="auth-brand">
        <h2>Inventory Guy</h2>
        <p class="sub">Sign in to continue</p>
      </div>
      <form id="login-form" class="list">
        <label class="col"><span>Email</span><input class="input" type="email" /></label>
        <label class="col"><span>Password</span><input class="input" type="password" /></label>
        <button class="btn btn-dark" type="submit">Login</button>
        <div class="login-credentials"><strong>Login credentials</strong><span>Email: admin@inventoryguy.com</span><span>Password: password123</span></div>
      </form>
    </div>
  </div>
  <script src="../assets/js/app-client.js"></script>
</body>
</html>
